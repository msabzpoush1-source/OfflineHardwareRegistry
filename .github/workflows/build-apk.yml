
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare release signing key
        env:
          RELEASE_KEY_BASE64: ${{ secrets.RELEASE_KEY_BASE64 }}
        run: |
          test -n "$RELEASE_KEY_BASE64"
          mkdir -p app
          printf '%s' "$RELEASE_KEY_BASE64" | base64 --decode > app/release-key.jks
          chmod 600 app/release-key.jks

      - name: Build Debug and Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD"
          gradle assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineHardwareRegistry-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineHardwareRegistry-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
